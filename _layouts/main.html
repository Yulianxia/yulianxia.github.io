---
layout: default
---

<header class="site-header">
  <a class="brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
  <nav class="nav-links" aria-label="主导航">
    <a href="{{ site.baseurl }}/">文章</a>
    <a href="{{ site.baseurl }}/tags/">标签</a>
    <a href="https://github.com/{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

{{ content }}

<footer class="site-footer">
  <p>{{ site.time | date: '%Y' }} &copy; {{ site.author }} · {{ site.about-author }}</p>
</footer>
